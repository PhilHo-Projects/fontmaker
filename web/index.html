<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fontmaker — specimen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14' font-family='serif'>A</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="bar">
  <select id="font" title="Font"></select>
  <label class="file">upload<input id="upload" type="file" accept=".ttf,.otf" multiple hidden></label>
  <input id="text" type="text" spellcheck="false" autocomplete="off"
         value="Handgloves quartz 38" title="Sample text">
  <label class="rng">size<input id="size" type="range" min="8" max="220" value="96"><output id="sizeout">96</output></label>
  <label class="rng">track<input id="track" type="range" min="-60" max="120" value="0"><output id="trackout">0</output></label>
  <button id="theme" type="button" title="Light / dark">◐</button>
  <span id="status"></span>
</header>

<main id="panels"></main>

<div id="drop">drop .ttf</div>

<script src="app.js"></script>
</body>
</html>
